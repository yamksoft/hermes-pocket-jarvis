[project]
name = "hermes-pocket-jarvis"
version = "0.2.0"
description = "Cross-platform Hermes, LiveKit Cloud, and Gemini Live dashboard"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "livekit-agents[google]>=1.6.9,<1.9",
  "livekit-api>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
